unbind r
bind r source-file ~/.tmux.conf
# Enable mouse support
set -g mouse on
# Set terminal and clipboard behavior
set -g default-terminal 'screen-256color'
set -g set-clipboard on
# Window behavior
set -g base-index 1
set -g renumber-windows on
set -g status-bg "#1e1e2e"
set -g status-fg "#cdd6f4"
# Status bar settings
set -g status on
set -g status-interval 1
set -g status-justify centre
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
# Window List Styling
setw -g window-status-format "#[fg=#cdd6f4] #I:#W "
setw -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W "
# Enable automatic window renaming based on the current working directory
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
# Load Catppuccin theme
run '~/.tmux/plugins/tmux/catppuccin.tmux'
# Left Section: TMUX Label, Pomodoro Timer
set -g status-left "#[fg=#fab387,bold] #{session_name} #[fg=#89b4fa] #{?client_prefix,PREFIX,} #[fg=#f38ba8]| #[fg=#f38ba8] #{pomodoro_status}"
# Right Section: Battery, CPU, Time
set -g status-right "#[fg=#f38ba8] %H:%M  #[fg=#f9e2af] 🔋 #{battery_percentage}% #[fg=#f38ba8] | #[fg=#fab387] CPU: #{cpu_percentage}%"
# Use Catppuccin theme
set -g @catppuccin_flavour 'mocha'
# Status bar modules
set -g @catppuccin_status_modules_left "session host time pomodoro"
set -g @catppuccin_status_modules_right "battery cpu"
# Status bar formatting
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator " | "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
# Customizing text in status bar
set -g @catppuccin_session_text "#[fg=#cba6f7,bold]TMUX#[default]"
set -g @catppuccin_host_text "󰌢 "
set -g @catppuccin_time_text "%H:%M"
# Window List Styling
# Inactive window styling
setw -g window-status-format "#[fg=#a7a6a4] #I: #W"
# Active window styling (index in purple, name in white)
setw -g window-status-current-format "#[fg=#cba6f7,bold] #I:#[fg=#fab387,bold] #W"
# Remove left and right separators
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_status_style "none"
# Pomodor plus
set -g @pomodoro_on "#[fg=#f37799,bold]🍅 "
set -g @pomodoro_complete "#[fg=#89d88b,bold]✔︎ Completed "
set -g @pomodoro_pause "#[fg=#74a8fc,bold]⏸︎ Paused "
set -g @pomodoro_prompt_break "#[fg=#a6e3a1]🕤 Break? "
set -g @pomodoro_prompt_pomodoro "#[fg=#89b4fa]🕤 Start? "
# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
